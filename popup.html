<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TabTrack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TabTrack</h1>
        </header>

        <div class="main-actions">
            <div class="save-session">
                <input type="text" id="sessionName" placeholder="Session name" maxlength="100" autofocus>
                <button id="saveSession">Save Current Tabs</button>
            </div>
            <p id="status" class="status" role="status" aria-live="polite"></p>
        </div>

        <div class="sessions-container">
            <div class="sessions-header">
                <h2>Saved Sessions <span id="sessionCount" class="count"></span></h2>
            </div>
            <input type="search" id="searchInput" class="search-input" placeholder="Search sessions or tabs…" aria-label="Search sessions" hidden>
            <div id="sessionsList"></div>
        </div>

        <div class="import-export">
            <input type="file" id="importFile" accept=".json,application/json" hidden>
            <button id="importButton">Import Sessions</button>
            <button id="exportButton">Export Sessions</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
